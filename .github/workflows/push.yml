on: push

jobs:
  build:
    runs-on: ubuntu-latest-large

    container:
        image: ghcr.io/linz/action-kart:v0.1.2

    steps:

        - name: Kart clone
          run: |
            kart clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/linz/topographic-data.git  --no-checkout

            ls -alh
            cd topographic-data/
            kart fetch origin ${{ github.sha }}

        - name: Diff
          run: |
            kart -C topographic-data diff ${{ github.sha }}..master

        - name: Export
          run: |
            kart -C topographic-data data ls | \
              xargs -P 4 -I {} kart -C topographic-data export --ref ${{ github.sha }} "{}" "{}.gpkg"
