on: push

jobs:
  build:
    runs-on: ubuntu-latest

    container:
        image: ghcr.io/linz/action-kart:v0.1.2

    steps:

        - name: Kart clone
          run: |
            kart clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/linz/topographic-data.git . --no-checkout

            cd topographic-data/
            kart switch ${{ github.sha }}

        - name: Export
          run: |
            for layer in $(kart data ls); do
              kart export "${layer}" "${layer}.gpkg"
            done