on: push

jobs:
  build:
    runs-on: ubuntu-latest

    container:
        image: ghcr.io/linz/action-kart:v0.1.2

    steps:

        - name: Kart clone
          run: |
            kart clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/linz/topographic-data.git  --no-checkout

            ls -alh
            cd topographic-data/
            kart fetch origin ${{ github.sha }}

        - name: Diff
          run: |
            kart diff ${{ github.sha }}..master

        - name: Export
          run: |
            for layer in $(kart data ls); do
              kart export --ref ${{ github.sha }} "${layer}" "${layer}.gpkg"
            done