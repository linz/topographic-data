name: pr-checks

on: pull_request

jobs:
  diff-qc-export:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linz/topographic-system/kart:pr-23

    permissions:
      id-token: write
      contents: read

    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    environment:
      name: nonprod

    steps:
#      - run: node /scripts/index.js version
      - run: node /scripts/index.js clone ${{ github.event.repository.clone_url }} --ref ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node /scripts/index.js diff
      - run: node /scripts/index.js pr-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#      - run: node /scripts/index.js export
      - name: Configuqre AWS Credentials
        if: ${{env.AWS_ROLE_ARN != ''}}
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - run: node /scripts/index.js to-parquet