name: kart
on: push
jobs:
  kart:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linz/topographic-system/kart:pr-34

    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
  
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ENVIRONMENT: nonprod

    environment:
      name: nonprod

    steps:
      - name: Check kart version
        run: node /scripts/index.js version

      - name: Clone repository
        run: node /scripts/index.js clone ${{ github.event.repository.clone_url }} --ref ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate diff
        run: node /scripts/index.js diff

      - name: Comment on PR
        run: node /scripts/index.js pr-comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diff artifacts
        uses: actions/upload-artifact@v5
        with:
          name: diff
          path: |
            pr_summary.md
            diff/

      - name: Export changed datasets
        run: node /scripts/index.js export

      - name: Upload gpkg artifacts
        uses: actions/upload-artifact@v5
        with:
          name: gpkg
          path: |
            export/

      - name: Configuqre AWS Credentials
        if: ${{env.AWS_ROLE_ARN != ''}}
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Convert to parquet
        run: node /scripts/index.js to-parquet

      - name: Upload parquet artifacts
        uses: actions/upload-artifact@v5
        with:
          name: parquet
          path: |
            parquet/
